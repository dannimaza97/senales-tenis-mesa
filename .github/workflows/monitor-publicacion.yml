name: Vigilar publicacion Supabase
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verificar ultima publicacion
        id: frescura
        continue-on-error: true
        run: python monitor_publicacion.py --max-minutos 45
      - name: Avisar por Telegram de publicacion detenida
        if: steps.frescura.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Sin token de Telegram; alerta disponible en Actions"
            exit 1
          fi
          texto="⚠️ PulsoPro: última publicación Supabase no confirmada en los últimos 45 minutos. Revisar https://github.com/${{ github.repository }}/actions/workflows/senales.yml"
          for chat_id in "663483538" "-1004364860113"; do
            curl --fail --silent --show-error --max-time 10 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat_id}" --data-urlencode "text=${texto}" >/dev/null || true
          done
          exit 1
