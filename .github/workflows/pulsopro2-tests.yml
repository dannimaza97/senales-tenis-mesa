name: PulsoPro 2 - Pruebas
on:
  push:
    branches: [pulsopro-2-motor-validado]
  pull_request:
    paths:
      - 'pulsopro2/**'
      - 'tests/test_pulsopro2.py'
      - '.github/workflows/pulsopro2-tests.yml'
jobs:
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p 'test_pulsopro2.py' -v
