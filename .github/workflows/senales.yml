name: Ejecutar señales

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes
  workflow_dispatch:

concurrency:
  group: senales-cron
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - run: pip install -r requirements.txt

      - name: Diagnostico conexion BetsAPI
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: |
          curl -s -m 10 -o /dev/null -w "Codigo HTTP: %{http_code}\nTiempo: %{time_total}s\n" "https://api.b365api.com/v1/events/upcoming?token=${BETSAPI_TOKEN}&sport_id=92&league_id=29097&page=1" || echo "FALLO: no se pudo conectar en 10 segundos"

      - name: Ejecutar motor de senales
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python senales_reales.py

      - name: Ejecutar motor de senales (primer set)
        # continue-on-error: si esta señal nueva falla por lo que sea (token
        # todavia no configurado, bug, etc.) nunca debe bloquear el paso de
        # abajo que guarda los datos de la señal original.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN_PRIMER_SET: ${{ secrets.TELEGRAM_BOT_TOKEN_PRIMER_SET }}
        run: python senales_primer_set.py

      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # historico_partidos.json ya NO se sube: supero el limite de 100MB de GitHub
          # (ver commit de este cambio) y cada push fallido dejaba SIN GUARDAR el resto
          # de archivos de este mismo commit (predicciones_pendientes/resultados_notificados/
          # estadisticas), asi que cada ejecucion repetia desde cero las mismas resoluciones
          # pendientes y volvia a mandar los avisos de Telegram ya enviados. Se sigue
          # escribiendo localmente en cada run (para Elo/H2H de esa ejecucion) pero deja de
          # versionarse hasta que tenga poda de tamano o se migre a otro almacenamiento.
          for f in predicciones_pendientes.json resultados_notificados.json avisos_enviados.json estadisticas.json ultima_actualizacion.json seleccion_diaria.json backfill_estado.json \
                   predicciones_pendientes_primer_set.json resultados_notificados_primer_set.json avisos_enviados_primer_set.json estadisticas_primer_set.json ultima_actualizacion_primer_set.json seleccion_diaria_primer_set.json resumen_diario_enviado_primer_set.json; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done
          for f in senales_*.txt; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done
          git commit -m "Actualizar datos" || echo "Sin cambios que guardar"
          git pull --rebase --strategy-option=ours || true
          git push || echo "No se pudo subir, se intentara en el proximo ciclo"

      - name: Avisar por Telegram si la ejecucion fallo
        # Antes, si un paso fallaba (BetsAPI caida, secret vencido, bug en el
        # motor, etc.) nadie se enteraba hasta notar que faltaban avisos en
        # Telegram, a veces horas o dias despues. Este paso corre solo cuando
        # algun paso anterior del job fallo (if: failure()) y manda un aviso
        # inmediato con el link a los logs de esta ejecucion.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          texto="⚠️ Ejecutar señales #${{ github.run_number }} FALLÓ (${{ github.event_name }}). Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for chat_id in "663483538" "-1004364860113"; do
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text=${texto}" \
              > /dev/null || true
          done
