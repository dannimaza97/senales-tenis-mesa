name: Ejecutar señales

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch:

concurrency:
  group: senales-cron
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Diagnostico conexion BetsAPI
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: |
          curl -s -m 10 -o /dev/null -w "Codigo HTTP: %{http_code}\nTiempo: %{time_total}s\n" "https://api.b365api.com/v1/events/upcoming?token=${BETSAPI_TOKEN}&sport_id=92&league_id=29097&page=1" || echo "FALLO: no se pudo conectar en 10 segundos"

      - name: Ejecutar motor de senales
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python senales_reales.py

      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in historico_partidos.json predicciones_pendientes.json resultados_notificados.json avisos_enviados.json estadisticas.json ultima_actualizacion.json seleccion_diaria.json backfill_estado.json; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done
          for f in senales_*.txt; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done
          git commit -m "Actualizar datos" || echo "Sin cambios que guardar"
          git pull --rebase --strategy-option=ours || true
          git push || echo "No se pudo subir, se intentara en el proximo ciclo"
